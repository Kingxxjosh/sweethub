{% extends "base.html" %}

{% block title %}Login - SweetHub{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 400px; margin: auto; padding: 20px; background: #1e1e1e; border-radius: 10px; color: white;">
  <h2 style="text-align:center; color:#adff2f;">🔐 Login to SweetHub</h2>

  {% if error %}
    <div class="error" style="color: red; text-align: center;">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('login') }}">
    <label for="username" style="color:#adff2f;">Username</label>
    <input type="text" name="username" id="username" placeholder="Enter username" required
           style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:none; background:#2a2a2a; color:white;">

    <label for="password" style="color:#adff2f;">Password</label>
    <input type="password" name="password" id="password" placeholder="Enter password" required
           style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:none; background:#2a2a2a; color:white;">

    <button type="submit" style="width:100%; background:#adff2f; color:#000; font-weight:bold; padding:12px; border:none; border-radius:8px; cursor:pointer;">
      🔓 Login
    </button>
  </form>

  <div class="login-link" style="text-align:center; margin-top: 15px;">
    <p>Don't have an account? <a href="{{ url_for('register') }}" style="color:#adff2f;">Register</a></p>
  </div>
</div>
{% endblock %}
