{% extends "base.html" %}

{% block title %}SweetHub Messenger{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  .chat-container {
    display: flex;
    height: 80vh;
    background-color: #1e1e1e;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 10px #adff2f55;
  }
  .chat-sidebar {
    width: 280px;
    background-color: #222;
    padding: 10px;
    overflow-y: auto;
    border-right: 2px solid #adff2f44;
  }
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: #181818;
  }
  .chat-header {
    padding: 12px 20px;
    background-color: #111;
    color: #adff2f;
    font-size: 18px;
    border-bottom: 1px solid #adff2f33;
  }
  .chat-toolbar {
    display: flex;
    gap: 10px;
    padding: 10px;
    background-color: #141414;
    border-bottom: 1px solid #333;
  }
  .chat-toolbar button {
    background: #adff2f;
    color: black;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: bold;
  }
  .chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    color: white;
  }
  .chat-message {
    margin-bottom: 12px;
    padding: 8px 12px;
    background-color: #2a2a2a;
    border-radius: 10px;
    max-width: 75%;
  }
  .chat-input {
    display: flex;
    padding: 10px;
    background-color: #111;
    border-top: 1px solid #333;
  }
  .chat-input input[type="text"] {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background-color: #222;
    color: white;
  }
  .chat-input button, .chat-input label {
    background: #adff2f;
    color: black;
    border: none;
    border-radius: 6px;
    padding: 10px 12px;
    margin-left: 10px;
    cursor: pointer;
  }
</style>

<div class="chat-container">
  <div class="chat-sidebar" id="userList"></div>
  <div class="chat-main">
    <div class="chat-header" id="chatWith">SweetHub Global Chat</div>
    <div class="chat-toolbar">
      <button onclick="joinRoom('group')">🌍 Global</button>
      <button onclick="joinRoom('adult')">🔞 Adult</button>
      <button onclick="openEmojiPicker()">😊 Emojis</button>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type your message...">
      <label for="fileInput"><i class="fas fa-paperclip"></i></label>
      <input type="file" id="fileInput" onchange="sendFile()" hidden>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
  const socket = io();
  const username = '{{ session.get("username", "Guest") }}';
  const userList = document.getElementById('userList');
  const messages = document.getElementById('messages');
  const messageInput = document.getElementById('messageInput');
  const fileInput = document.getElementById('fileInput');
  const chatWith = document.getElementById('chatWith');
  let currentRoom = 'group';

  function joinRoom(room) {
    socket.emit("join", { room });
    currentRoom = room;
    messages.innerHTML = '';
    chatWith.innerText = room === 'group' ? "SweetHub Global Chat" : `${room} Room`;
  }

  function sendMessage() {
    const msg = messageInput.value.trim();
    if (msg) {
      socket.emit("send_message", {
        sender: username,
        content: msg,
        room: currentRoom,
        type: 'text'
      });
      messageInput.value = '';
    }
  }

  function sendFile() {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      socket.emit("send_message", {
        sender: username,
        content: e.target.result,
        filename: file.name,
        room: currentRoom,
        type: 'file'
      });
    };
    reader.readAsDataURL(file);
  }

  function openEmojiPicker() {
    alert("Emoji picker coming soon!");
  }

  socket.on("receive_message", data => {
    if (data.room === currentRoom) {
      const div = document.createElement('div');
      div.className = 'chat-message';
      div.innerHTML = `<strong>${data.sender}:</strong> ` +
        (data.type === 'file'
          ? `<a href="${data.content}" target="_blank">${data.filename}</a>`
          : data.content);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  });

  socket.on("user_list", users => {
    userList.innerHTML = '';
    users.forEach(user => {
      const div = document.createElement('div');
      div.style.padding = '10px';
      div.style.borderBottom = '1px solid #444';
      div.innerHTML = `<strong>${user.username}</strong><br><small>${user.country || ''}</small>`;
      userList.appendChild(div);
    });
  });

  joinRoom('group');
  socket.emit("request_users");
</script>
{% endblock %}
