{% extends 'base.html' %}

{% block title %}Upload Video | SweetHub{% endblock %}

{% block content %}
<h2 style="text-align:center; color:#adff2f;">🚀 Upload New Video</h2>

<form action="{{ url_for('upload_video') }}" method="POST" enctype="multipart/form-data" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; background:#111; padding:20px; border-radius:10px; max-width:1200px; margin:auto;">

  <input type="text" name="title" placeholder="Title" required style="flex:1; min-width:200px; padding:10px; border-radius:8px; border:none; background:#222; color:#fff;">

  <select name="category" required style="flex:1; min-width:150px; padding:10px; border-radius:8px; background:#222; color:#fff;">
    <option disabled selected>Category</option>
    {% for cat in categories %}
      <option value="{{ cat }}">{{ cat }}</option>
    {% endfor %}
  </select>

  <select name="version" required style="flex:1; min-width:100px; padding:10px; border-radius:8px; background:#222; color:#fff;">
    <option disabled selected>Version</option>
    {% for ver in versions %}
      <option value="{{ ver }}">{{ ver }}</option>
    {% endfor %}
  </select>

  <select name="country" required style="flex:1; min-width:150px; padding:10px; border-radius:8px; background:#222; color:#fff;">
    <option disabled selected>Country</option>
    {% for country in countries %}
      <option value="{{ country }}">{{ country }}</option>
    {% endfor %}
  </select>

  <input type="text" name="tags" placeholder="Tags e.g. sweet,hub,video" style="flex:1 1 250px; padding:10px; border-radius:8px; background:#222; color:white;">

  <label style="color:#adff2f; font-size:14px;">Video File (.mp4):</label>
  <input type="file" name="video" accept="video/mp4" style="color:white;">

  <label style="color:#adff2f; font-size:14px;">Thumbnail (.jpg, .png):</label>
  <input type="file" name="thumbnail" accept="image/*" style="color:white;">

  <input type="text" name="embed_code" placeholder="Embed Code (optional)" style="flex:1 1 350px; padding:10px; border-radius:8px; background:#222; color:white;">

  <div style="flex:1 1 100%; display:flex; align-items:center;">
    <input type="checkbox" name="is_premium" id="is_premium" style="margin-right:8px;">
    <label for="is_premium" style="color:#adff2f;">Premium Video 💎</label>
  </div>

  <button type="submit" style="background:#adff2f; color:black; font-weight:bold; padding:12px 25px; border:none; border-radius:8px; cursor:pointer;">Upload</button>
</form>

<h3 style="text-align:center; color:#adff2f; margin-top:20px;">📺 Uploaded Videos</h3>
{% endblock %}
