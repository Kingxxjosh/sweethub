{% extends "base.html" %}
{% block title %}Register as Model - SweetHub{% endblock %}
{% block content %}
<style>
  .form-container {
    max-width: 600px;
    margin: 40px auto;
    background-color: #1a1a1a;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 12px #adff2f55;
  }

  .form-container h2 {
    text-align: center;
    color: #adff2f;
    margin-bottom: 25px;
  }

  label {
    display: block;
    margin-top: 15px;
    font-size: 14px;
    color: #eee;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
    background-color: #222;
    color: #fff;
  }

  button {
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    background-color: #adff2f;
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background-color: #dfff66;
  }

  .note {
    font-size: 12px;
    color: #aaa;
    margin-top: 10px;
  }

  .form-group {
    margin-bottom: 15px;
  }
</style>

<div class="form-container">
  <h2>📸 Become a Verified Model</h2>

  <form method="POST" enctype="multipart/form-data">
    {% if error %}
      <p style="color:red; text-align:center;">{{ error }}</p>
    {% endif %}

    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" name="username" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address:</label>
      <input type="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number:</label>
      <input type="text" name="phone" required>
    </div>

    <div class="form-group">
      <label for="gender">Gender:</label>
      <select name="gender" required>
        <option value="">Select Gender</option>
        <option value="female">Female</option>
        <option value="trans">Trans</option>
      </select>
    </div>

    <div class="form-group">
      <label for="age">Age:</label>
      <input type="number" name="age" required>
    </div>

    <div class="form-group">
      <label for="country">Country:</label>
      <select name="country" required>
        {% for country in countries %}
          <option value="{{ country }}">{{ country }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="profile_pic">Profile Photo:</label>
      <input type="file" name="profile_pic" accept="image/*" required>
    </div>

    <div class="form-group">
      <label for="id_card">Upload ID Card (for age & gender verification):</label>
      <input type="file" name="id_card" accept="image/*" required>
    </div>

    <div class="form-group">
      <label for="selfie">Upload Selfie with ID (for identity proof):</label>
      <input type="file" name="selfie" accept="image/*" required>
    </div>

    <div class="form-group">
      <label for="telegram">Telegram/Contact Link:</label>
      <input type="text" name="telegram">
    </div>

    <div class="form-group">
      <label for="bio">Short Bio/About You:</label>
      <textarea name="bio" rows="4" placeholder="Describe yourself..."></textarea>
    </div>

    <div class="form-group">
      <label for="password">Create Password:</label>
      <input type="password" name="password" required>
    </div>

    <div class="form-group">
      <label for="confirm">Confirm Password:</label>
      <input type="password" name="confirm" required>
    </div>

    <button type="submit">Submit Application</button>

    <p class="note">By submitting, you agree to be verified. All info will be reviewed manually to prevent impersonation.</p>
  </form>
</div>
{% endblock %}
